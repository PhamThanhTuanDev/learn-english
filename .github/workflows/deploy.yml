name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://english.minlish.site
    env:
      APP_DIR: learn-english
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, bcmath, zip
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Build frontend
        run: npm ci && npm run build

      - name: Stage release
        run: |
          release="$RUNNER_TEMP/release"
          rsync -a --exclude-from=- ./ "$release/" <<'EOF'
          .git*
          node_modules/
          + /storage/**/
          - /storage/**
          /.env
          /.env.*
          /.claude/
          /docker/
          /docs/
          /tests/
          /tools/
          /AGENTS.md
          /CLAUDE.md
          /README.md
          /.editorconfig
          /.npmrc
          /compose.yaml
          /package.json
          /package-lock.json
          /phpstan.neon
          /phpunit.xml
          /postcss.config.js
          /tailwind.config.js
          /vite.config.js
          EOF
          (cd "$release" && find . -type f -printf '%P\n' | LC_ALL=C sort) > "$RUNNER_TEMP/manifest"
          mv "$RUNNER_TEMP/manifest" "$release/.deploy-manifest.new"

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # No --delete: .env, storage/ data and AutoSSL's public/.well-known exist
      # only on the server. Stale files are removed in the next step instead.
      - name: Upload
        run: rsync -rlpz --checksum --delay-updates --chmod=D755,F644 "$RUNNER_TEMP/release/" "production:$APP_DIR/"

      # Delete only files that the previous deploy uploaded and this one no longer has.
      - name: Remove files dropped since last deploy
        run: |
          ssh production "cd $APP_DIR && sh -s" <<'EOF'
          set -e
          if [ -f .deploy-manifest ]; then
            LC_ALL=C comm -23 .deploy-manifest .deploy-manifest.new | while IFS= read -r f; do
              case "$f" in .env*|storage/*|public/.well-known/*) continue ;; esac
              rm -f -- "$f"
            done
          fi
          mv .deploy-manifest.new .deploy-manifest
          EOF
